<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caps Sorting · Level difficulty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Level difficulty page of the Caps Sorting GDD: a 40-level difficulty table + chart, then the choice-width design of
   the levels that have one (data from the level builder's playtest, 200 runs per bot, with the 2 RV slots). */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --ink:#18203A; --muted:#566079; --line:#D6DCE8; --tint:#E3E8F1;
  --rail:#232A40; --rail-ink:#EEF1F8; --accent:#1F55D6; --focus:#1F55D6;
  --wide:#2f9e6a; --mid:#2f7fbf; --narrow:#d08a1c; --stuck:#c8364e; --good:#2f9e6a; --bad:#c8364e;
  --r-tut:#8C95A8; --r-intro:#1FA3A0; --r-med:#2F7FBF; --r-after:#2F9E6A; --r-pre:#E08A1E; --r-hard:#C8364E;
  /* cap colours as in the level builder: 1 Red, 2 Orange, 3 Blue, 4 Green, 5 Purple, 6 Yellow, 7 Cyan, 8 Pink */
  --c-red:#D9363E; --c-orange:#F58220; --c-blue:#2563EB; --c-green:#1B8641; --c-purple:#7C4DDB; --c-yellow:#F4BE0B; --c-teal:#22B8D1; --c-pink:#F472B6;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131826; --surface:#1B2234; --ink:#E9EDF7; --muted:#A3ADC4; --line:#2F3852; --tint:#232B41;
    --rail:#0E1220; --accent:#8FB1FF; --focus:#8FB1FF;
    --wide:#45b882; --mid:#5a9ee0; --narrow:#e0a23e; --stuck:#e8607a; --good:#45b882; --bad:#e8607a;
    --r-tut:#7B849A; --r-intro:#3CC2BF; --r-med:#5A9EE0; --r-after:#45B882; --r-pre:#E9A148; --r-hard:#E8607A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131826; --surface:#1B2234; --ink:#E9EDF7; --muted:#A3ADC4; --line:#2F3852; --tint:#232B41;
  --rail:#0E1220; --accent:#8FB1FF; --focus:#8FB1FF;
  --wide:#45b882; --mid:#5a9ee0; --narrow:#e0a23e; --stuck:#e8607a; --good:#45b882; --bad:#e8607a;
  --r-tut:#7B849A; --r-intro:#3CC2BF; --r-med:#5A9EE0; --r-after:#45B882; --r-pre:#E9A148; --r-hard:#E8607A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

.top{position:sticky;top:0;z-index:10;background:var(--rail);color:var(--rail-ink)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--rail-ink);text-decoration:none;font:600 .95rem/1 var(--body);padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.08)}
.back:hover{background:rgba(255,255,255,.14)}
.back svg{width:16px;height:16px}
.top .ttl{flex:1;min-width:0;font:800 1.2rem/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);flex:none}
.lang button{border:0;background:none;color:var(--rail-ink);font:600 .85rem/1 var(--body);padding:9px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#18203A}

main{max-width:1180px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-right,0px));display:grid;gap:36px}
.intro{display:grid;gap:10px;max-width:80ch}
.intro h1{font-size:clamp(1.9rem,4vw,2.6rem)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px;min-width:0}
.card h2{font-size:1.5rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}

.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:640px;height:auto;overflow:visible}
.chart .bar{cursor:pointer}
.chart .bar:hover,.chart .bar.on{opacity:.72}
.readout{min-height:1.6em;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.readout b{color:var(--ink)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--tint);font-weight:600;font-size:.8rem;color:var(--muted);vertical-align:bottom;white-space:normal;min-width:64px}
th.l,td.l{text-align:left}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr.hard{background:color-mix(in srgb,var(--r-hard) 8%,transparent)}
tbody th{font-weight:700}
.role{display:inline-block;font-size:.76rem;font-weight:600;padding:1px 9px;border-radius:999px;color:#fff}
.score{font-weight:700}
.meter{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--tint);vertical-align:middle;margin-left:8px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
td.w{min-width:170px}
.strip{display:block;width:160px;height:22px}
.strip-link{display:inline-block;border-radius:4px}
.none{color:var(--muted)}
.wcell{display:flex;align-items:center;gap:8px}
.tag{font-size:.7rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;white-space:nowrap}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start}
.rules .role{justify-self:start}
.plist{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.plist li{border-left:3px solid var(--stuck);padding:2px 0 2px 12px;display:grid;gap:4px}
.plist .k{font-weight:600}
.plist .at{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.els{display:flex;flex-wrap:wrap;gap:6px}
.els span{font-size:.76rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink);background:var(--paper)}

.levels{display:grid;gap:22px}
.level{scroll-margin-top:72px}
.lhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.stuck{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.stuck h3{font:600 .8rem/1.2 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stuck .title{font-weight:600;font-size:1.05rem}
.vi-note{font-size:.82rem;color:var(--muted);font-style:italic}
.board{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;overflow-x:auto}
.row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start;min-width:520px}
.row>.lab{font-size:.8rem;color:var(--muted);padding-top:3px}
.belt{display:flex;flex-wrap:wrap;gap:4px}
.belt i{width:13px;height:13px;border-radius:50%;display:block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.slots,.queues{display:flex;flex-wrap:wrap;gap:8px}
.box{width:78px;border-radius:7px;color:#fff;font-size:.74rem;font-weight:600;padding:5px 6px;line-height:1.25;text-shadow:0 1px 1px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.box small{display:block;font-weight:500;opacity:.95}
.box.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);text-shadow:none;font-weight:500}
.box.rv{border-style:dotted}
.box.hid{background:repeating-linear-gradient(135deg,#59606c 0 6px,#4b515c 6px 12px)}
.box.hl{outline:2.5px solid var(--ink);outline-offset:2px}
.queue{display:grid;gap:5px;align-content:start}
.queue .qn{font-size:.74rem;color:var(--muted)}
.path{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink);background:var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.verdict{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;color:#fff;white-space:nowrap;justify-self:start}
.foot{color:var(--muted);font-size:.85rem;max-width:90ch}
@media (max-width:640px){
  .top .ttl{font-size:1rem}
  .back .txt{display:none}
  .card{padding:16px}
  .row{grid-template-columns:1fr;min-width:0}
  .rules li{grid-template-columns:1fr;gap:4px}
}
@media print{.top{position:static}.chart .bar{cursor:default}}
</style>
</head>

: "Màu ẩn trước khi cửa mở", "sit": "Băng có một màu không hộp hiện nào khớp. Cửa sắp mở đổ thêm 16 hạt màu đó.", "move": "Lật hộp ẩn đúng hàng trước khi cửa mở. Chờ cửa mở mới lật thì hạt tràn băng."}]}, "38": {"q": 4, "el": ["LK", "BQ"], "w": [4, 4, 4, 4, 4, 4, 3, 3, 3, 2, 1, 1, 2, 4, 4, 4, 4, 4, 4, 4], "idea": "Medium với Hộp liên kết và Hàng chờ bị chặn: một chỗ kẹt ở khoảng 50%.", "lesson": "Liên kết đôi khi phải chờ cả một hàng mở.", "st": [{"at": 10, "kind": "Nửa liên kết ở hàng bị chặn", "sit": "Hộp cần liên kết với hộp ở đầu một hàng đang bị chặn, đếm 2.", "move": "Gửi 2 hộp tự đầy từ hai hàng khác để mở chặn. Hai lựa chọn còn lại đều đưa lên hộp chưa có hạt."}]}, "39": {"q": 4, "el": ["LK", "LI"], "w": [4, 4, 4, 4, 2, 2, 1, 1, 2, 2, 2, 3, 2, 1, 1, 2, 4, 4, 4, 4], "idea": "Pre-Hard với Hộp liên kết và Vật phẩm bị khóa: hai chỗ kẹt ở 1/3 và 2/3.", "lesson": "Gỡ liên kết sớm, gửi hộp muộn.", "st": [{"at": 6, "kind": "Hộp liên kết", "sit": "Hộp cần liên kết với hộp thứ 3 ở hàng khác.", "move": "Đào hàng đó bằng hộp có hạt sắp vào."}, {"at": 13, "kind": "Hạt khóa của hộp liên kết", "sit": "Hạt của cặp vừa gỡ đang bị khóa số 2.", "move": "Gỡ liên kết nhưng chưa gửi hộp đó. Gửi 2 hộp khác trước."}]}, "40": {"q": 4, "el": ["H", "LB", "LI", "BQ"], "w": [4, 4, 2, 2, 1, 1, 2, 2, 1, 1, 1, 2, 2, 1, 1, 2, 1, 1, 1, 2], "idea": "Màn cuối: Hard với Hộp ẩn, Hộp bị khóa, Vật phẩm bị khóa và Hàng chờ bị chặn. Bốn chỗ kẹt.", "lesson": "Tổng hợp mọi bài học: đếm khóa, đếm chặn, tìm hộp ẩn, giữ slot.", "st": [{"at": 4, "kind": "Hàng chờ bị chặn", "sit": "Hàng có hộp cần dùng bị chặn, đếm 3.", "move": "Gửi 3 hộp đầy nhanh từ các hàng khác."}, {"at": 8, "kind": "Hộp ẩn bị khóa", "sit": "Hộp ẩn khi lộ ra là màu cần nhưng khóa số 2.", "move": "Lật sớm để khóa đếm cùng các lượt gửi khác."}, {"at": 13, "kind": "Vật phẩm bị khóa", "sit": "Băng có hạt khóa số 3, hộp cùng màu ở đầu hàng.", "move": "Chưa gửi hộp đó. Gửi 3 hộp khác trước."}, {"at": 16, "kind": "Slot cuối", "sit": "Còn 1 slot, khối chặn sắp chuyển và hạt khóa sắp mở.", "move": "Chỉ một hàng đi tiếp, trong 3 lượt liền."}]}};

<script>
(function(){
'use strict';
const KEY='capsSortingGddLang';
let lang='en';
try{const s=localStorage.getItem(KEY);if(s==='en'||s==='vi')lang=s;}catch(e){}
const t=(en,vi)=>lang==='vi'?vi:en;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>lang==='vi'?String(v).replace('.',','):String(v);

/* roles as the playtest names them (Vietnamese) -> colour + English label */
const ROLE={'Hướng dẫn':['tut','Tutorial','Hướng dẫn'],'Giới thiệu':['intro','Intro','Giới thiệu'],'Medium':['med','Medium','Medium'],
  'Sau Hard':['after','After Hard','Sau Hard'],'Pre-Hard':['pre','Pre-Hard','Pre-Hard'],'Hard':['hard','Hard','Hard']};
const roleOf=r=>ROLE[r]||['med',r,r];
const roleCol=r=>`var(--r-${roleOf(r)[0]})`;
const roleName=r=>t(roleOf(r)[1],roleOf(r)[2]);
const score=d=>Math.round((100-(d.casual+d.watcher)/2)*10)/10;

const C={1:['red','Red','Đỏ'],2:['orange','Orange','Cam'],3:['blue','Blue','Xanh dương'],4:['green','Green','Xanh lá'],5:['purple','Purple','Tím'],6:['yellow','Yellow','Vàng'],7:['teal','Cyan','Xanh ngọc'],8:['pink','Pink','Hồng']};
const col=c=>`var(--c-${C[c][0]})`, nm=c=>t(C[c][1],C[c][2]);
const tone=(v,trap,q=3)=>trap?'var(--stuck)':v>=q?'var(--wide)':v>=2?'var(--mid)':'var(--narrow)';
const EL={H:['Hidden Box','Hộp ẩn'],LB:['Locked Box','Hộp bị khóa'],LK:['Linked Box','Hộp liên kết'],BD:['Block Door','Cửa chặn'],LI:['Locked Item','Vật phẩm bị khóa'],BQ:['Block Queue','Hàng chờ bị chặn']};
const elName=k=>t(EL[k][0],EL[k][1]);
const SVGNS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.append(e);return e;};
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};

const UI={
  en:{back:'GDD',title:'Level difficulty',lang:'Language'},
  vi:{back:'GDD',title:'Độ khó màn chơi',lang:'Ngôn ngữ'}
};

/* a small strip of one level's choice width: one bar per send, height = queues that still win */
function strip(D){
  const N=D.steps.length,W=160,H=22,bw=W/N;
  let s=`<svg class="strip" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  D.steps.forEach((v,i)=>{const hh=Math.max(2,v/(D.q||3)*(H-2));s+=`<rect x="${(i*bw+bw*.1).toFixed(2)}" y="${(H-hh).toFixed(2)}" width="${(bw*.8).toFixed(2)}" height="${hh.toFixed(2)}" rx="1" fill="${tone(v,D.traps.includes(i),D.q||3)}"/>`;});
  return s+'</svg>';
}

/* a small strip of one level's planned choice width: 20 bars, 5% of the level each */
function planStrip(Pl){
  const N=Pl.w.length,W=160,H=22,bw=W/N,at=Pl.st.map(x=>x.at);
  let s=`<svg class="strip" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  Pl.w.forEach((v,i)=>{const hh=Math.max(2,v/Pl.q*(H-2));s+=`<rect x="${(i*bw+bw*.1).toFixed(2)}" y="${(H-hh).toFixed(2)}" width="${(bw*.8).toFixed(2)}" height="${hh.toFixed(2)}" rx="1" fill="${tone(v,at.includes(i),Pl.q)}"/>`;});
  return s+'</svg>';
}

/* difficulty chart: one bar per level (score), coloured by role */
function diffChart(host,readout){
  const W=1000,H=260,m={t:12,r:6,b:34,l:34},MAX=100,N=DIFF.length,bw=(W-m.l-m.r)/N,y=v=>H-m.b-(v/MAX)*(H-m.t-m.b);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':t('Difficulty score of levels 1 to 40','Điểm khó của màn 1 đến 40')},host);
  [0,25,50,75,100].forEach(v=>{
    el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?'var(--line)':'var(--ink)','stroke-dasharray':v?'3 4':'', 'stroke-width':v?1:1.2},svg);
    el('text',{x:m.l-8,y:y(v)+4,'text-anchor':'end','font-size':12,fill:'var(--muted)'},svg).textContent=v;
  });
  const say=i=>{const d=DIFF[i];
    readout.innerHTML=`<b>${t('Level','Màn')} ${d.level} · ${esc(d.name)}</b> (${esc(roleName(d.role))}): ${t('score','điểm khó')} <b>${fmt(score(d))}</b>. ${t('Casual','Casual')} ${d.casual}%, ${t('watcher','watcher')} ${d.watcher}%, ${t('random taps','bấm ngẫu nhiên')} ${d.random}%.`;
    svg.querySelectorAll('.bar').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));};
  DIFF.forEach((d,i)=>{const v=Math.max(0,score(d)),x=m.l+i*bw+bw*.14,w=bw*.72;
    const r=el('rect',{x,y:y(v),width:w,height:Math.max(1,y(0)-y(v)),rx:2,fill:roleCol(d.role),class:'bar','data-i':i,tabindex:0},svg);
    el('title',{},r).textContent=`${t('Level','Màn')} ${d.level}: ${fmt(score(d))}`;
    r.addEventListener('click',()=>say(i));r.addEventListener('focus',()=>say(i));
    if(MEASURED[d.level]||REBUILT[d.level])el('circle',{cx:x+w/2,cy:y(v)-7,r:3.2,fill:'var(--ink)'},svg);
    else if(PLAN[d.level])el('circle',{cx:x+w/2,cy:y(v)-7,r:2.8,fill:'var(--surface)',stroke:'var(--ink)','stroke-width':1.4},svg);
    if(d.level===1||d.level%5===0)el('text',{x:x+w/2,y:H-12,'text-anchor':'middle','font-size':12,fill:'var(--muted)'},svg).textContent=d.level;
  });
  readout.textContent=t('Tap a bar to see that level. A filled dot marks a level whose choice width is measured on the built level; a hollow dot marks a level with a planned design.','Bấm vào một cột để xem màn đó. Chấm đặc: màn đã dựng theo thiết kế và đo độ rộng lựa chọn thật. Chấm rỗng: màn mới có thiết kế (kế hoạch).');
}

/* choice-width chart of one level */
function widthChart(n,D,host,readout){
  const W=900,H=200,m={t:10,r:6,b:34,l:28},MAX=D.q||3,N=D.steps.length,bw=(W-m.l-m.r)/N,y=v=>H-m.b-(v/MAX)*(H-m.t-m.b);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':t(`Winning queues over ${N} sends of level ${n}`,`Số hàng còn thắng qua ${N} lượt gửi của màn ${n}`)},host);
  for(let v=0;v<=MAX;v++){
    el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?'var(--line)':'var(--ink)','stroke-dasharray':v?'3 4':'','stroke-width':v?1:1.2},svg);
    el('text',{x:m.l-8,y:y(v)+4,'text-anchor':'end','font-size':12,fill:'var(--muted)'},svg).textContent=v;
  }
  const say=i=>{const v=D.steps[i],trap=D.traps.includes(i);
    readout.innerHTML=`<b>${t('Send','Lượt')} ${i+1}</b>: ${t(`${v} queue${v===1?'':'s'} still win`,`${v} hàng còn thắng`)}${trap?t('. Stuck: the obvious tap loses',', kẹt: nước dễ thấy dẫn tới thua'):v===1?t(', only one move left',', chỉ còn một nước'):''}${i===D.pick?t(' (board below)',' (sơ đồ bên dưới)'):''}.`;
    svg.querySelectorAll('.bar').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));};
  D.steps.forEach((v,i)=>{const x=m.l+i*bw+bw*.12,w=bw*.76,trap=D.traps.includes(i);
    const r=el('rect',{x,y:y(v),width:w,height:y(0)-y(v),rx:2,fill:tone(v,trap,D.q||3),class:'bar','data-i':i,tabindex:0},svg);
    el('title',{},r).textContent=`${t('Send','Lượt')} ${i+1}: ${v}${trap?t(', stuck',', kẹt'):''}`;
    r.addEventListener('click',()=>say(i));r.addEventListener('focus',()=>say(i));
    if(trap)el('circle',{cx:x+w/2,cy:y(0)+12,r:Math.min(5,w/2),fill:'var(--stuck)'},svg);
  });
  [0,4,9,14,19,24,29,34,39].filter(i=>i<N).forEach(i=>{el('text',{x:m.l+(i+.5)*bw,y:H-4,'text-anchor':'middle','font-size':11,fill:'var(--muted)'},svg).textContent=i+1;});
  readout.textContent=t('Tap a bar to see that send.','Bấm vào một cột để xem lượt gửi đó.');
}

/* planned choice width of one level: 20 bars, 5% of the level each */
function planChart(n,Pl,host,readout){
  const W=900,H=200,m={t:10,r:6,b:34,l:28},MAX=Pl.q,N=Pl.w.length,bw=(W-m.l-m.r)/N,y=v=>H-m.b-(v/MAX)*(H-m.t-m.b),at=Pl.st.map(x=>x.at);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':t(`Planned winning queues over level ${n}`,`Số hàng còn thắng theo thiết kế của màn ${n}`)},host);
  for(let v=0;v<=MAX;v++){
    el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?'var(--line)':'var(--ink)','stroke-dasharray':v?'3 4':'','stroke-width':v?1:1.2},svg);
    el('text',{x:m.l-8,y:y(v)+4,'text-anchor':'end','font-size':12,fill:'var(--muted)'},svg).textContent=v;
  }
  const say=i=>{const v=Pl.w[i],k=at.indexOf(i);
    readout.innerHTML=`<b>${i*5}–${i*5+5}%</b> ${t('of the level','của màn')}: ${t(`${v} of ${Pl.q} queues should still win`,`${v}/${Pl.q} hàng còn thắng`)}${k>=0?t(`. Stuck ${k+1}: the obvious tap loses`,`, kẹt ${k+1}: nước dễ thấy dẫn tới thua`):v===1?t(', only one move left',', chỉ còn một nước'):''}.`;
    svg.querySelectorAll('.bar').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));};
  Pl.w.forEach((v,i)=>{const x=m.l+i*bw+bw*.12,w=bw*.76,k=at.indexOf(i);
    const r=el('rect',{x,y:y(v),width:w,height:y(0)-y(v),rx:2,fill:tone(v,k>=0,Pl.q),class:'bar','data-i':i,tabindex:0},svg);
    el('title',{},r).textContent=`${i*5}–${i*5+5}%: ${v}${k>=0?t(', stuck',', kẹt'):''}`;
    r.addEventListener('click',()=>say(i));r.addEventListener('focus',()=>say(i));
    if(k>=0){el('circle',{cx:x+w/2,cy:y(0)+12,r:8,fill:'var(--stuck)'},svg);el('text',{x:x+w/2,y:y(0)+16,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#fff'},svg).textContent=k+1;}
  });
  [0,5,10,15,20].forEach(i=>{el('text',{x:m.l+i*bw,y:H-4,'text-anchor':i===0?'start':i===20?'end':'middle','font-size':11,fill:'var(--muted)'},svg).textContent=`${i*5}%`;});
  readout.textContent=t('Tap a bar to see that part of the level.','Bấm vào một cột để xem đoạn đó của màn.');
}

function planCard(d){
  const n=d.level,Pl=PLAN[n],N=Pl.w.length,ones=Pl.w.filter(v=>v===1).length,avg=Pl.w.reduce((s,v)=>s+v,0)/N;
  const sec=h('section','card level');sec.id=`level-${n}`;
  sec.append(h('div','lhead',`<h2>${t('Level','Màn')} ${n} · ${esc(d.name)}</h2><span class="role" style="background:${roleCol(d.role)}">${esc(roleName(d.role))}</span><span class="tag">${t('Plan','Kế hoạch')}</span>`));
  sec.append(h('div','stats',`<span>${t('Score','Điểm khó')} <b>${fmt(score(d))}</b></span><span><b>${Pl.q}</b> ${t('queues','hàng chờ')}</span><span>${t('Planned average','Trung bình theo thiết kế')} <b>${fmt(avg.toFixed(1))}</b> ${t('winning queues','hàng còn thắng')}</span><span><b>${Pl.st.length}</b> ${t('stuck moments','chỗ kẹt')}</span><span><b>${ones*5}%</b> ${t('of the level with one move left','của màn chỉ còn 1 nước')}</span>`));
  sec.append(h('div','els',Pl.el.length?Pl.el.map(k=>`<span>${esc(elName(k))}</span>`).join(''):`<span>${t('No elements','Không có yếu tố')}</span>`));
  const ch=h('div','chart'),ro=h('p','readout');sec.append(ch,ro);
  const st=h('div','stuck');
  st.append(h('h3',null,t('Design','Thiết kế')));
  if(lang==='en')st.append(h('p','vi-note','The design notes below are written in Vietnamese.'));
  st.append(h('p','title',esc(Pl.idea)));
  st.append(h('ol','plist',Pl.st.map((x,k)=>`<li><span class="at">${t('Stuck','Kẹt')} ${k+1} · ${t('around','khoảng')} ${x.at*5+3}%</span><span class="k">${esc(x.kind)}</span><span>${esc(x.sit)}</span><span>${esc(x.move)}</span></li>`).join('')));
  st.append(h('p',null,`<b>${t('What the player learns:','Điều người chơi học được:')}</b> ${esc(Pl.lesson)}`));
  const R=REBUILT[n];
  if(R){
    const N2=R.steps.length,tr=R.traps.map(i=>Math.round(i/N2*100)+'%').join(', ');
    const ms=h('div','stuck');
    ms.append(h('h3',null,`${t('Measured on the rebuilt level','Đo thật trên màn đã dựng lại')} <span class="tag">${t('Measured','Đo thật')}</span>`));
    ms.append(h('p',null,`${t('Score','Điểm khó')} <b>${fmt(score(d))}</b> · ${N2} ${t('sends','lượt gửi')} · ${t('stuck sends at','lượt kẹt ở')} <b>${tr||'–'}</b> ${t('of the level','của màn')}.`));
    const ch2=h('div','chart'),ro2=h('p','readout');ms.append(ch2,ro2);sec.append(ms);
    widthChart(n,R,ch2,ro2);
  }
  sec.append(st);
  planChart(n,Pl,ch,ro);
  return sec;
}

const boxHTML=(b,extra='')=>{
  if(!b)return `<div class="box empty${extra}">${t('Empty','Trống')}</div>`;
  if(b.empty)return `<div class="box empty rv">RV<small>${t('open, empty','đã mở, trống')}</small></div>`;
  if(b.hid)return `<div class="box hid">?<small>${t('Hidden Box','Hộp ẩn')}</small></div>`;
  const amt=b.have!=null?`${b.have}/${b.cap}`:`${b.cap} ${t('items','hạt')}`;
  return `<div class="box${extra}" style="background:${col(b.c)}">${nm(b.c)}<small>${amt}</small></div>`;
};

function levelCard(d){
  const n=d.level,D=MEASURED[n],T=TEXT[n],S=D.s,N=D.steps.length;
  const ones=D.steps.filter(v=>v===1).length,avg=D.steps.reduce((s,v)=>s+v,0)/N;
  const sec=h('section','card level');sec.id=`level-${n}`;
  sec.append(h('div','lhead',`<h2>${t('Level','Màn')} ${n} · ${esc(d.name)}</h2><span class="role" style="background:${roleCol(d.role)}">${esc(roleName(d.role))}</span>`));
  sec.append(h('div','stats',`<span>${t('Score','Điểm khó')} <b>${fmt(score(d))}</b></span><span><b>${N}</b> ${t('sends','lượt gửi')}</span><span>${t('Average','Trung bình')} <b>${fmt(avg.toFixed(1))}</b> ${t('winning queues','hàng còn thắng')}</span><span><b>${ones}</b> ${t('sends with one move left','lượt chỉ còn 1 nước')}</span><span>${t('Stuck at send','Kẹt ở lượt')} <b>${D.traps.map(k=>k+1).join(', ')}</b></span>`));
  const ch=h('div','chart'),ro=h('p','readout');sec.append(ch,ro);
  const st=h('div','stuck');
  st.append(h('h3',null,`${t('Stuck moment','Tình huống kẹt')} · ${t('send','lượt')} ${D.pick+1}`));
  if(lang==='en')st.append(h('p','vi-note','The design notes below are written in Vietnamese.'));
  st.append(h('p','title',esc(T.title)));
  st.append(h('p',null,esc(T.sit)));
  const beltList=Object.entries(S.belt).flatMap(([c,k])=>Array(k).fill(+c));
  const beltHTML=beltList.length?beltList.map(c=>`<i style="background:${col(c)}" title="${esc(nm(c))}"></i>`).join(''):`<span class="path">${t('Empty','Trống')}</span>`;
  const pathRow=(seq,side)=>`<span class="path"><b style="font-weight:600;color:var(--ink)">${side}</b>${seq.map(([c,k])=>`<span class="chip"><i class="dot" style="background:${col(c)}"></i>${nm(c)} ${k}</span>`).join('<span aria-hidden="true">→</span>')}</span>`;
  const slots=S.slots.map(s=>boxHTML(s)).join('')+Array(S.rvLeft).fill(`<div class="box empty rv">RV<small>${t('not open','chưa mở')}</small></div>`).join('');
  const queues=S.queues.map((q,i)=>{
    const tag=i===D.ob?`<span class="verdict" style="background:var(--bad)">${t('Obvious · loses','Dễ thấy · thua')}</span>`:D.win.includes(i)?`<span class="verdict" style="background:var(--good)">${t('Goes on','Đi tiếp')}</span>`:`<span class="verdict" style="background:var(--bad)">${t('Loses','Thua')}</span>`;
    return `<div class="queue"><span class="qn">${t('Queue','Hàng')} ${i+1}</span>${q.map((b,k)=>boxHTML(b,k===0?' hl':'')).join('')}${tag}</div>`;}).join('');
  st.append(h('div','board',
    `<div class="row"><div class="lab">${t('Belt','Băng chuyền')}</div><div class="belt">${beltHTML}</div></div>`+
    `<div class="row"><div class="lab">${t('Enter Paths, next rows','Enter Path sắp vào')}</div><div style="display:grid;gap:6px">${pathRow(S.path[0],t('Path 1','Đường 1'))}${S.path[1]?pathRow(S.path[1],t('Path 2','Đường 2')):''}</div></div>`+
    `<div class="row"><div class="lab">${t('Slots','Slot')}</div><div class="slots">${slots}</div></div>`+
    `<div class="row"><div class="lab">${t('Queues (front on top)','Hàng chờ (đầu hàng ở trên)')}</div><div class="queues">${queues}</div></div>`));
  st.append(h('p',null,esc(T.why)));
  st.append(h('p',null,`<b>${t('What the player learns:','Điều người chơi học được:')}</b> ${esc(T.lesson)}`));
  sec.append(st);
  widthChart(n,D,ch,ro);
  return sec;
}

function render(){
  const root=document.documentElement;root.lang=lang;root.dataset.lang=lang;
  const ui=UI[lang];document.title=`Caps Sorting · ${ui.title}`;
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=ui[e.dataset.t];});
  const ls=document.getElementById('langSwitch');ls.setAttribute('aria-label',ui.lang);
  ls.querySelectorAll('[data-set-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.setLang===lang?'true':'false'));
  const main=document.getElementById('main');main.innerHTML='';
  const designed=DIFF.filter(d=>MEASURED[d.level]);

  main.append(h('div','intro',
    `<h1>${t('Level difficulty, levels 1–40','Độ khó màn chơi, màn 1–40')}</h1>`+
    `<p class="muted">${t(
      'Bot win rates from the level builder playtest: 200 runs per bot on each level, with the 2 RV slots open. The careful bot is also played without RV, so every level must stay solvable without them. Difficulty score = 100 − (casual + watcher) / 2: higher is harder.',
      'Tỉ lệ thắng của các bot từ bài đo trong level builder: mỗi bot chơi 200 lượt trên mỗi màn, có mở 2 slot RV. Bot cẩn thận còn được đo khi không dùng RV, để màn nào cũng thắng được mà không cần RV. Điểm khó = 100 − (casual + watcher) / 2: càng cao càng khó.')}</p>`));

  const legend=`<div class="legend">${Object.keys(ROLE).map(r=>`<span><i class="sw" style="background:${roleCol(r)}"></i>${esc(roleName(r))}</span>`).join('')}</div>`;
  const c1=h('section','card',`<h2>${t('Difficulty score by level','Điểm khó theo màn')}</h2>${legend}`);
  const ch=h('div','chart'),ro=h('p','readout');c1.append(ch,ro);main.append(c1);diffChart(ch,ro);

  const wl=`<div class="legend"><span><i class="sw" style="background:var(--wide)"></i>${t('Every queue wins','Mọi hàng còn thắng')}</span><span><i class="sw" style="background:var(--mid)"></i>${t('2 or more queues, not all','Còn 2 hàng trở lên, không phải tất cả')}</span><span><i class="sw" style="background:var(--narrow)"></i>${t('1 queue: one move left','1 hàng: chỉ còn một nước')}</span><span><i class="sw" style="background:var(--stuck)"></i>${t('Stuck: the obvious tap loses','Kẹt: nước dễ thấy thì thua')}</span></div>`;
  const pct=v=>`${v}%`;
  const rows=DIFF.map(d=>{const D=MEASURED[d.level],s=score(d);
    const Pl=PLAN[d.level];
    const w=D?`<span class="wcell"><a class="strip-link" href="#level-${d.level}" aria-label="${t('Choice width of level','Độ rộng lựa chọn của màn')} ${d.level}">${strip(D)}</a><span class="tag">${t('Measured','Đo thật')}</span></span>`:
      Pl?(REBUILT[d.level]?`<span class="wcell"><a class="strip-link" href="#level-${d.level}" aria-label="${t('Measured choice width of level','Độ rộng lựa chọn đo thật của màn')} ${d.level}">${strip(REBUILT[d.level])}</a><span class="tag">${t('Measured','Đo thật')}</span></span>`:'')+`<span class="wcell"><a class="strip-link" href="#level-${d.level}" aria-label="${t('Planned choice width of level','Thiết kế độ rộng lựa chọn của màn')} ${d.level}">${planStrip(Pl)}</a><span class="tag">${t('Plan','Kế hoạch')}</span></span>`:'';
    return `<tr${roleOf(d.role)[0]==='hard'?' class="hard"':''}><th scope="row">${d.level}</th><td class="l">${esc(d.name)}</td><td class="l"><span class="role" style="background:${roleCol(d.role)}">${esc(roleName(d.role))}</span></td>`+
      `<td><span class="score">${fmt(s)}</span><span class="meter"><i style="width:${Math.max(0,Math.min(100,s))}%;background:${roleCol(d.role)}"></i></span></td>`+
      `<td>${pct(d.random)}</td><td>${pct(d.stay)}</td><td>${pct(d.glance)}</td><td>${pct(d.casual)}</td><td>${pct(d.watcher)}</td><td>${pct(d.careful_no_rv)}</td><td class="l w">${w}</td></tr>`;}).join('');
  main.append(h('section','card',
    `<h2>${t('All 40 levels','Cả 40 màn')}</h2>${wl}`+
    `<div class="tbl" tabindex="0" role="region" aria-label="${t('Difficulty of levels 1 to 40','Độ khó màn 1 đến 40')}"><table><thead><tr>`+
    `<th scope="col">${t('Level','Màn')}</th><th scope="col" class="l">${t('Name','Tên')}</th><th scope="col" class="l">${t('Role','Vai trò')}</th><th scope="col">${t('Score','Điểm khó')}</th>`+
    `<th scope="col">${t('Random taps','Bấm ngẫu nhiên')}</th><th scope="col">${t('One queue','Bấm 1 hàng')}</th><th scope="col">${t('Belt glancer','Liếc băng')}</th><th scope="col">Casual</th><th scope="col">${t('Belt watcher','Theo dõi băng')}</th><th scope="col">${t('Careful, no RV','Cẩn thận, không RV')}</th><th scope="col" class="l">${t('Choice width design','Thiết kế độ rộng lựa chọn')}</th>`+
    `</tr></thead><tbody>${rows}</tbody></table></div>`+
    `<p class="foot">${t(
      `Measured: levels ${designed.map(d=>d.level).join(', ')} were built to their design, and the strip is measured on the built level (one bar per send). Levels 11–40 were rebuilt to their design on 2026-11-06: the Measured strip is the built level (one bar per send), the Plan strip is the design target (one bar per 5% of the level). Levels 1–4 are left blank. Tap a strip to open that level below.`,
      `Đo thật: màn ${designed.map(d=>d.level).join(', ')} đã dựng theo thiết kế, dải là số đo trên màn thật (mỗi cột là một lượt gửi). Màn 11–40 đã dựng lại theo thiết kế ngày 2026-11-06: dải Đo thật là màn đã dựng (mỗi cột là một lượt gửi), dải Kế hoạch là thiết kế mục tiêu (mỗi cột là 5% màn chơi). Màn 1–4 để trống. Bấm vào một dải để mở màn đó bên dưới.`)}</p>`));

  const lv=h('div','levels');
  lv.append(h('div','intro',`<h2 style="font-size:1.7rem">${t('Choice width by level','Độ rộng lựa chọn theo màn')}</h2>`+
    `<p class="muted">${t(
      'At each send on the careful bot\'s line, every queue that can be tapped is tried, then the careful bot plays on to the end without RV. The bar is how many queues still win. A stuck send is one where the obvious tap (the belt-watching pick) loses.',
      'Tại mỗi lượt gửi trên đường chơi của bot cẩn thận, thử gửi từng hàng có thể bấm, rồi để bot cẩn thận chơi tiếp tới hết màn mà không dùng RV. Cột là số hàng còn thắng. Lượt kẹt là lượt mà nước dễ thấy (bot theo dõi băng chọn) dẫn tới thua.')}</p>${wl}`));
  designed.forEach(d=>lv.append(levelCard(d)));
  main.append(lv);

  const planned=DIFF.filter(d=>PLAN[d.level]&&!MEASURED[d.level]);
  const pv=h('div','levels');
  const R=[['Giới thiệu',t('Wide almost all level. One teaching moment at about 45%: the obvious tap loses, but the other queues still win. No send with only one move left (except the 2-queue level 22).','Rộng gần hết màn. Một tình huống dạy yếu tố ở khoảng 45%: nước dễ thấy thì thua, nhưng các hàng khác vẫn thắng. Không có lượt chỉ còn 1 nước (trừ màn 22 chỉ có 2 hàng).')],
    ['Sau Hard',t('A breather, about as hard as level 8. Wide, with one short stuck at about 55% (5% of the level with one move left).','Màn nghỉ, khó cỡ level 8. Rộng, có một chỗ kẹt ngắn ở khoảng 55% (5% màn chỉ còn 1 nước).')],
    ['Medium',t('At least as hard as level 6. Narrows from about 30%, one stuck at about 50% (10% of the level with one move left), then easy to the end.','Ít nhất bằng level 6. Hẹp dần từ khoảng 30%, một chỗ kẹt ở khoảng 50% (10% màn chỉ còn 1 nước), sau đó dễ tới cuối.')],
    ['Medium',t('Right after an intro level (13, 18, 23, 28, 33): Medium, but only about as hard as level 8. It reuses the new element with the challenge rules below.','Ngay sau màn giới thiệu (13, 18, 23, 28, 33): Medium nhưng không cần quá khó, khoảng bằng level 8. Dùng lại yếu tố mới theo các quy tắc thử thách bên dưới.')],
    ['Pre-Hard',t('At least as hard as level 29. Two stucks, at about 1/3 and 2/3, each with 10% of the level with one move left.','Ít nhất bằng level 29. Hai chỗ kẹt ở khoảng 1/3 và 2/3, mỗi chỗ 10% màn chỉ còn 1 nước.')],
    ['Hard',t('At least as hard as level 10. Three stucks (about 25%, 45%, 70%), the last one a run of 20% of the level with one move left. Wide only at the very start and end.','Ít nhất bằng level 10. Ba chỗ kẹt (khoảng 25%, 45%, 70%), chỗ cuối kéo dài 20% màn chỉ còn 1 nước. Chỉ rộng ở đầu và cuối màn.')]];
  pv.append(h('div','intro',`<h2 style="font-size:1.7rem">${t('Planned choice width, levels 11–40','Thiết kế độ rộng lựa chọn, màn 11–40')}</h2>`+
    `<p class="muted">${t(
      'Each level\'s design follows its role and the elements it uses (GDD section 7, Level config). Each bar is 5% of the level: how many queues should still win there. Numbered red dots are the planned stuck moments. The levels were rebuilt to these designs; each card also shows the choice width measured on the built level.',
      'Thiết kế của mỗi màn dựa trên vai trò và các yếu tố màn đó dùng (GDD mục 7, Cấu hình màn chơi). Mỗi cột là 5% màn chơi: số hàng nên còn thắng ở đoạn đó. Chấm đỏ có số là các chỗ kẹt theo kế hoạch. Các màn đã được dựng lại theo thiết kế này; mỗi thẻ có thêm độ rộng lựa chọn đo thật trên màn đã dựng.')}</p>${wl}`));
  pv.append(h('section','card',`<h2>${t('Shape by role','Khung theo vai trò')}</h2><ul class="rules">${R.map(([r,txt])=>`<li><span class="role" style="background:${roleCol(r)}">${esc(roleName(r))}</span><span>${esc(txt)}</span></li>`).join('')}</ul>`));
  planned.forEach(d=>pv.append(planCard(d)));
  main.append(pv);
  main.append(h('p','foot',t(`Data from the level builder (hvtanh07/Cabs-Sort-level-builder), updated ${UPDATED}.`,`Dữ liệu từ level builder (hvtanh07/Cabs-Sort-level-builder), cập nhật ${UPDATED}.`)));
}

document.getElementById('langSwitch').addEventListener('click',e=>{const b=e.target.closest('[data-set-lang]');if(!b||b.dataset.setLang===lang)return;
  lang=b.dataset.setLang;try{localStorage.setItem(KEY,lang);}catch(err){}render();});
render();
if(location.hash){const tgt=document.getElementById(location.hash.slice(1));if(tgt)tgt.scrollIntoView();}
})();
</script>
